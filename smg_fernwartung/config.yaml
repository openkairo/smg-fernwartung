name: SMG Fernwartung
version: "0.3.0"
slug: smg_fernwartung
description: Zeitlich begrenzte Fernwartung auf Knopfdruck
arch:
  - aarch64
  - amd64
init: false
# Rechte für den eingebauten HA-MCP-Server (dieselben wie die HA-MCP-App)
homeassistant_api: true
hassio_api: true
hassio_role: manager
# Für Befehle des Technikers im Fehlerfall: Konfiguration von Home Assistant und der geteilte Ordner
map:
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: true
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lifebuoy
panel_title: Fernwartung
options:
  geraetekennung: ""
  geraeteschluessel: ""
  dienst_url: wss://fern.wattrebellen.de/geraet
  shell: true
schema:
  geraetekennung: str
  geraeteschluessel: password
  mcp_url: password?
  mcp_token: password?
  dienst_url: str
  shell: bool?
